#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "rust-baseline"
version = "0.1.0"
authors = ["harmon25 <dougwright1@gmail.com>"]
description = ""

[[trigger.http]]
route = "/..."
component = "rust-baseline"

[component.rust-baseline]
source = "target/wasm32-wasip1/release/rust_baseline.wasm"
allowed_outbound_hosts = []
[component.rust-baseline.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
